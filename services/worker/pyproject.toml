[project]
name = "diffusers-multi-tenant-lora-serving-worker"
version = "0.1.0"
description = "Stateless Diffusers worker: per-request LoRA load, generate, unload"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "T20", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
